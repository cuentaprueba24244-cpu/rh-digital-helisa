<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acta de gestión integral · Comserva</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .doc-tools { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px var(--gutter); }
  .doc-tools .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 1180px; margin: 0 auto; }
  .doc-tools label { font-size: 12px; font-weight: 600; color: var(--fg-2); }
  .doc-tools .select { width: auto; max-width: 100%; min-width: 220px; padding: 7px 10px; font-size: 13px; }
  .doc-tools .spacer { flex: 1; }
  .doc-tools .state { font-size: 12px; color: var(--fg-3); }
  .retenida-bar { background: var(--danger); color: #fff; padding: 10px var(--gutter); font-weight: 600; text-align: center; font-size: 13px; }
  .retenida-bar span { font-weight: 400; opacity: .95; }
  .sheet { padding: 12mm 16mm 34mm; font-size: 10pt; }
  .brandline { display: flex; align-items: center; gap: 10px; }
  .brandline .word { font-family: var(--font-doc-display); font-size: 17pt; font-weight: 700; color: #1f5e43; line-height: 1; }
  .brandline small { display: block; font-size: 6.5pt; color: #333; letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; max-width: 150px; }
  table.acta-head td { border: 1px solid #111; padding: 6px 10px; vertical-align: middle; }
  table.acta-head td.l { width: 230px; }
  table.acta-head td.t { text-align: center; font-weight: 700; font-size: 11pt; }
  table.acta-head td.v { width: 150px; font-weight: 700; font-size: 9.5pt; padding: 0; }
  table.acta-head td.v div { padding: 7px 10px; }
  table.acta-head td.v div + div { border-top: 1px solid #111; }
  .acta-title { text-align: center; font-size: 11pt; margin: 14px 0 10px; font-family: var(--font-doc); font-weight: 700; }
  .acta-title small { display: block; font-weight: 400; font-size: 8.5pt; color: #333; }
  .cert, .resp { text-align: justify; font-size: 9.5pt; }
  table.kv-tbl { margin: 10px 0; font-size: 9.5pt; }
  table.kv-tbl td { border: 1px solid #111; padding: 3px 8px; }
  table.kv-tbl td.k { width: 160px; text-align: right; font-weight: 700; }
  table.kv-tbl td.v { text-align: center; }
  table.res th { border: 1px solid #111; background: #fff; text-align: center; font-size: 8.5pt; text-transform: none; letter-spacing: 0; vertical-align: middle; }
  table.res td { border: 1px solid #111; padding: 3px 8px; font-size: 9.5pt; vertical-align: middle; }
  table.res td.q { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.res tr.extra td { background: #fbf0d2; }
  table.res tr.total td { font-weight: 700; }
  .resp { margin-top: 10px; }
  .constancia { margin-top: 10px; font-size: 9.5pt; }
  .firma-g { margin-top: 18px; text-align: center; font-size: 9.5pt; }
  .firma-g .pad { height: 64px; display: grid; place-items: center; }
  .firma-g .pad svg { height: 64px; width: auto; }
  .firma-g b { display: block; font-style: italic; font-weight: 700; }
  .firma-g .aprob { font-size: 8pt; color: #333; margin-top: 6px; }
  .firma-g .pend { color: #666; font-style: italic; font-size: 9pt; }
  .sheet .foot { border-top: 3px solid #b3261e; justify-content: space-between; align-items: flex-end; }
  .sheet .foot .r { text-align: right; }
  .sheet .watermark span.borr { color: rgba(0, 0, 0, .07); }
  @media print { @page { size: A4 portrait; } .sheet { zoom: 1 !important; padding: 0 0 18mm !important; page-break-after: auto; } .retenida-bar { display: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="aviso"></div>
<div class="doc-tools no-print">
  <div class="row">
    <a class="btn sm ghost" href="index.html">‹ Documentos</a>
    <label for="sel">Cliente y periodo</label>
    <select id="sel" class="select"></select>
    <span class="state" id="state"></span>
    <span class="spacer"></span>
    <button class="btn primary" id="print" type="button">Imprimir / guardar PDF</button>
  </div>
</div>
<div class="doc-stage"><div class="sheet" id="sheet" aria-live="polite"></div></div>

<script src="../assets/data.js"></script>
<script>
(function () {
  const D = window.DATA;
  const E = D.empresa;
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.getElementById('bar').innerHTML = D.mockBar('Documentos PDF');

  const LOGO = '<svg width="54" height="54" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#1f5e43"/><circle cx="32" cy="32" r="25" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/><path d="M32 12c11 7 15 18 10 31-7-2-11-7-13-14-1 9-3 14-9 17-6-13-1-26 12-34z" fill="#fff"/><path d="M27 46c3-8 6-14 11-20" stroke="#1f5e43" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
  const brand = () => `<div class="brandline">${LOGO}<div><span class="word">ComServa</span><small>${esc(E.razon_social)}</small></div></div>`;

  const CLIENTES = D.clientes.filter((c) => c.estado === 'activo');
  const PERIODOS = D.periodos.filter((p) => D.visitas.some((v) => v.periodo === p.id));
  const DEFAULT = 'c-cofema|2026-09';
  // Orden del acta real GD.FM.01
  const ORDEN = ['BIO', 'CORROS', 'ANATO', 'CORTO', 'TOX', 'RAEES', 'REACT'];
  const actaDe = (c, p) => D.actas.find((a) => a.cliente === c.id && a.periodo === p.id) || null;
  const gerenciaUser = D.usuarios.find((u) => u.rol === 'gerencia');

  const sel = document.getElementById('sel');
  sel.innerHTML = PERIODOS.slice().reverse().map((p) => `<optgroup label="${esc(p.nombre)}${p.estado === 'abierto' ? ' (en curso)' : ''}">` + CLIENTES.map((c) => {
    const a = actaDe(c, p);
    const tag = a ? `Acta N.º ${a.consecutivo}${a.estado === 'retenida' ? ' · retenida' : ''}` : 'borrador';
    return `<option value="${c.id}|${p.id}">${esc(c.nombre_comercial)} · ${tag}</option>`;
  }).join('') + '</optgroup>').join('');

  function actual() {
    const [cid, pid] = decodeURIComponent(location.hash.slice(1)).split('|');
    const c = CLIENTES.find((x) => x.id === cid), p = PERIODOS.find((x) => x.id === pid);
    if (c && p) return { c, p };
    const [dc, dp] = DEFAULT.split('|');
    return { c: D.cliente(dc), p: D.periodos.find((x) => x.id === dp) };
  }

  function render() {
    const { c, p } = actual();
    sel.value = `${c.id}|${p.id}`;
    const acta = actaDe(c, p);
    const retenida = !!acta && acta.estado === 'retenida';
    const t = D.totalizar(c.id, p.id);
    const fechaActa = acta ? acta.fecha : (p.estado === 'cerrado' ? p.fin : D.HOY);
    const fd = D.parseISO(fechaActa);
    const id = acta ? acta.id : `acta|${c.id}|${p.id}`;
    const hash = D.hashFake(id);
    const extra = D.categorias.filter((cat) => !cat.en_acta && t.porCat[cat.codigo] > 0);
    const fin = D.parseISO(p.fin);
    const periodoLabel = `${D.MESES[fin.getMonth()].toUpperCase()} ${fin.getFullYear()}`;
    document.title = acta ? `Acta N.º ${acta.consecutivo} · ${c.nombre_comercial}` : `Acta (borrador) · ${c.nombre_comercial}`;
    document.getElementById('state').textContent = `${acta ? (retenida ? 'Retenida por mora' : 'Emitida y publicada') : 'Borrador: se numera al aprobarla el gerente'} · ${D.fmtKg(t.kg)} kg · código ${hash.slice(0, 16)}`;
    document.getElementById('aviso').innerHTML = retenida ? `<div class="retenida-bar no-print">Retenida: no se publica en el portal hasta que el cliente se ponga al día. <span>${esc(acta.retenida_motivo)}</span></div>` : '';

    const filas = ORDEN.map((k) => {
      const cat = D.categoria(k); const kg = t.porCat[k] || 0; const disp = D.dispositor(cat.dispositor);
      return `<tr><td>${esc(cat.nombre_acta)}</td><td class="q">${kg ? D.fmtKg(kg) : '0'} kg</td><td>${esc(cat.tratamiento)}</td><td>${disp ? esc(disp.nombre) : '—'}</td></tr>`;
    }).join('') + extra.map((cat) => `<tr class="extra"><td>${esc(cat.nombre_acta)}</td><td class="q">${D.fmtKg(t.porCat[cat.codigo])} kg</td><td>Sin tratamiento definido (pendiente de decisión de la gerencia)</td><td>—</td></tr>`).join('');

    document.getElementById('sheet').innerHTML = `
      ${retenida ? '<div class="watermark"><span>RETENIDA</span></div>' : (!acta ? '<div class="watermark"><span class="borr">BORRADOR</span></div>' : '')}
      <table class="acta-head">
        <tr>
          <td class="l">${brand()}</td>
          <td class="t">ACTA DE GESTIÓN INTEGRAL<br>DE RESIDUOS</td>
          <td class="v"><div>VERSIÓN: 01</div><div>CÓDIGO: GD.FM.01</div></td>
        </tr>
      </table>
      <h1 class="acta-title">ACTA DE GESTIÓN INTEGRAL DE RESIDUOS N.º ${acta ? acta.consecutivo : `<span style="color:#b3261e">BORRADOR</span>`}${acta ? '' : `<small>Número pendiente: se asigna al aprobarla el gerente (siguiente disponible: ${D.parametros.siguiente_acta})</small>`}</h1>
      <p class="cert"><b><i>${esc(E.nombre_corto.toUpperCase())}</i></b> Certifica el Transporte, Almacenamiento, Tratamiento y/o Disposición Final de los residuos relacionados a continuación, conforme a lo establecido en la Licencia Ambiental otorgada por <b>CORPOAMAZONIA mediante la Resolución No. 0038 del 23 de enero del 2006</b>.</p>
      <table class="kv-tbl">
        <tr><td class="k">EMPRESA</td><td class="v"><b>${esc(c.nombre_comercial.toUpperCase())}</b></td></tr>
        <tr><td class="k">NIT</td><td class="v">${esc(c.nit)}${c.dv ? '-' + esc(c.dv) : ''}</td></tr>
        <tr><td class="k">CAMPO / BASE</td><td class="v">${esc((c.sede + ' · ' + c.ciudad + ' ' + c.departamento).toUpperCase())}</td></tr>
        <tr><td class="k">PERIODO</td><td class="v">${periodoLabel} (${D.fmtFechaCorta(p.inicio)} – ${D.fmtFechaCorta(p.fin)})</td></tr>
      </table>
      <table class="res">
        <thead><tr><th style="width:30%">RESIDUOS RECEPCIONADOS</th><th style="width:16%">CANTIDAD</th><th style="width:30%">APROVECHAMIENTO, TRATAMIENTO Y/O DISPOSICIÓN FINAL</th><th>DISPOSITOR FINAL</th></tr></thead>
        <tbody>
          ${filas}
          <tr class="total"><td style="text-align:center">TOTAL KILOGRAMOS</td><td class="q">${D.fmtKg(t.kg)} kg</td><td colspan="2">${t.visitas.length} visita${t.visitas.length === 1 ? '' : 's'} con recolección en el periodo${t.fallidas ? ` · ${t.fallidas} sin recolección` : ''}</td></tr>
        </tbody>
      </table>
      ${extra.length ? `<p class="resp" style="font-size:8.5pt;color:#5a3d03"><b>Nota:</b> las filas resaltadas corresponden a categorías que el cliente entregó pero que todavía no tienen tratamiento ni dispositor definido. La gerencia debe definirlo antes de publicar el acta.</p>` : ''}
      <p class="resp">De acuerdo con lo anterior, <b>${esc(E.nombre_corto.toUpperCase())}</b> se hace responsable del transporte y almacenamiento de los residuos mencionados, hasta su entrega a los diferentes dispositores para su aprovechamiento, tratamiento y/o disposición final. En el caso de los residuos biológicos, estos se gestionan mediante tratamiento térmico, el cual permite la eliminación efectiva de agentes patógenos e infecciosos. Durante este proceso, los residuos son sometidos a temperaturas que oscilan entre 800 °C y 1200 °C; adicionalmente, el tratamiento cuenta con sistemas de control de emisiones que reducen la contaminación ambiental.</p>
      <p class="constancia">Para constancia se firma en Florencia a los ${fd.getDate()} días del mes de ${D.MESES[fd.getMonth()]} de ${fd.getFullYear()}.</p>
      <div class="firma-g">
        <div class="pad">${acta ? D.firmaSVG('gerente', '#1b2a66') : '<span class="pend">Pendiente de aprobación y firma del gerente</span>'}</div>
        <b>${esc(E.gerente.toUpperCase())}</b>
        <b>GERENTE</b>
        <div class="aprob">${acta ? `Aprobada en el sistema por ${esc(acta.aprobada_por)} el ${esc(acta.aprobada_en)} (usuario ${esc(gerenciaUser ? gerenciaUser.email : 'gerencia')})${retenida ? ' · Publicación retenida por cartera' : ' · Publicada en el portal del cliente'}` : 'Al aprobarla, el sistema asigna el consecutivo, registra usuario, fecha y hora, y la publica en el portal solo si el cliente está al día.'}</div>
      </div>
      <div class="verif">
        ${D.qrSVG(id)}
        <div>
          <div>Verifique este documento en comserva.com.co/verificar con el código <span class="mono">${hash.slice(0, 16)}</span></div>
          <div class="legal">Documento generado electrónicamente por RH digital Comserva; firmado en pantalla conforme a la Ley 527 de 1999 y el Decreto 2364 de 2012.</div>
        </div>
      </div>
      <div class="foot">
        <span>${esc(E.licencia)}</span>
        <span class="r"><b>${esc(E.nombre_corto.toUpperCase())}</b> · NIT. ${E.nit}<br>Email: ${esc(E.email)} · ${esc(E.ciudad)} · <span style="white-space:nowrap">Tel: ${esc(E.telefonos)}</span><br>${esc(E.direccion)}</span>
      </div>`;
    fit();
  }

  function fit() {
    const avail = document.documentElement.clientWidth - 32;
    document.querySelectorAll('.sheet').forEach((s) => {
      const nominal = s.classList.contains('landscape') ? 1122.5 : 793.7;
      const z = Math.min(1, avail / nominal);
      s.style.zoom = z < 1 ? z.toFixed(3) : '';
      s.style.maxWidth = z < 1 ? 'none' : '';
    });
  }

  sel.addEventListener('change', (e) => { location.hash = e.target.value; });
  window.addEventListener('hashchange', render);
  window.addEventListener('resize', fit);
  document.getElementById('print').addEventListener('click', () => window.print());
  render();
})();
</script>
</body>
</html>
