<body>

  <rect x="288" y="580" width="24" height="16" rx="3" fill="#c8d0cb"/>

  <!-- celular en las manos (se muestra en la pose de digitar) -->

    <rect x="258" y="356" width="84" height="146" rx="12" fill="#0f1512" transform="rotate(-4 300 430)"/>

      <rect x="272" y="412" width="56" height="12" rx="4" fill="#fff"/>
      <rect x="272" y="430" width="56" height="12" rx="4" fill="#fff"/>
      <rect x="272" y="466" width="56" height="14" rx="5" fill="#2b6a4b"/>
    </g>

  <!-- brazo izquierdo (del espectador): hombro 206,310 · codo 206,440 · muñeca 206,560 -->
  <g id="X-hI">
    <rect x="184" y="292" width="44" height="160" rx="22" fill="#1f5e43"/>
    <g id="X-cI">
      <rect x="186" y="428" width="40" height="138" rx="20" fill="#1f5e43"/>
      <rect x="186" y="540" width="40" height="18" rx="6" fill="#174d36"/>
      <g id="X-mI">
        <!-- bolsa roja de residuos (se muestra con la pose de cargar) -->

          <path d="M196 572 C176 600 150 640 156 700 C162 752 250 752 256 700 C262 640 236 600 216 572 Z" fill="#c62d24"/>
          <path d="M196 572 C176 600 150 640 156 700 C160 728 190 744 206 744" fill="none" stroke="#a3231c" stroke-width="6"/>
          <path d="M194 566 q12 10 24 0" stroke="#7d1a14" stroke-width="7" fill="none" stroke-linecap="round"/>
          <path d="M184 652 l20 -30 l20 30 z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
          <circle cx="204" cy="642" r="3" fill="#fff"/>
        </g>
        <circle cx="206" cy="572" r="24" fill="#2d3a34"/>
        <ellipse cx="226" cy="562" rx="9" ry="13" fill="#2d3a34" transform="rotate(-30 226 562)"/>
      </g>
    </g>
  </g>

  <!-- brazo derecho: hombro 394,310 · codo 394,440 · muñeca 394,560 -->
  <g id="X-hD">
    <rect x="372" y="292" width="44" height="160" rx="22" fill="#1f5e43"/>
    <g id="X-cD">
      <rect x="374" y="428" width="40" height="138" rx="20" fill="#1f5e43"/>
      <rect x="374" y="540" width="40" height="18" rx="6" fill="#174d36"/>
      <g id="X-mD">

  <!-- cabeza: gira sobre la base del cuello (300,262) -->

    <circle cx="364" cy="192" r="15" fill="#a86b46"/>

      <ellipse cx="323" cy="194" rx="7" ry="9" fill="#1c2420"/>
      <circle cx="279.5" cy="190.5" r="2.4" fill="#fff"/>
      <circle cx="325.5" cy="190.5" r="2.4" fill="#fff"/>

    <path d="M300 200 q-8 15 3 20" stroke="#8a5236" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M281 226 q19 -10 38 0 q-19 7 -38 0 z" fill="#241a15"/>
    <path d="M283 236 q17 14 34 0" stroke="#5a2e1e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- gorra verde con la hoja de la marca -->
    <path d="M232 152 C232 80 368 80 368 152 Z" fill="#2b6a4b"/>
    <path d="M268 90 C258 104 252 126 252 152 L262 152 C262 128 266 108 276 94 Z" fill="#fff" opacity=".10"/>
    <path d="M300 82 L300 152" stroke="#1f5e43" stroke-width="3"/>
    <rect x="231" y="144" width="138" height="11" rx="4" fill="#1f5e43"/>
    <path d="M234 152 Q300 168 366 152 Q372 162 360 167 Q300 180 240 167 Q228 162 234 152 Z" fill="#123d2b"/>
    <g transform="translate(300 118)"><circle r="15" fill="#fff"/><path d="M0 -9c5 3 8 9 4 15-3-1-5-3-6-6-1 4-2 6-4 7-3-6-1-12 6-16z" fill="#2b6a4b"/></g>
    <circle cx="300" cy="81" r="6" fill="#1f5e43"/>
  </g>
</svg>
</template>

<script>
  // Crea un operario dentro de `host` con prefijo de ids `px` y devuelve su rig.
  function crearOperario(host, px) {
    host.innerHTML = document.getElementById('operario').innerHTML.replaceAll('X-', px + '-');
    const $ = (id) => host.querySelector('#' + px + '-' + id);
    const st = { hI: 0, cI: 0, mI: 0, hD: 0, cD: 0, mD: 0, cab: 0, cabY: 0, ojos: 1, cel: 0, bolsa: 0 };
    function aplicar() {
      $('hI').setAttribute('transform', `rotate(${st.hI} 206 310)`);
      $('cI').setAttribute('transform', `rotate(${st.cI} 206 440)`);
      $('mI').setAttribute('transform', `rotate(${st.mI} 206 560)`);
      $('hD').setAttribute('transform', `rotate(${st.hD} 394 310)`);
      $('cD').setAttribute('transform', `rotate(${st.cD} 394 440)`);
      $('mD').setAttribute('transform', `rotate(${st.mD} 394 560)`);
      $('cab').setAttribute('transform', `translate(0 ${st.cabY}) rotate(${st.cab} 300 262)`);
      $('ojos').setAttribute('transform', `translate(0 ${194 * (1 - st.ojos)}) scale(1 ${st.ojos})`);
      $('cel').setAttribute('opacity', st.cel);
      $('bolsa').setAttribute('opacity', st.bolsa);
    }
    aplicar();
    return { st, aplicar };
  }
  const POSES = {
    cargar: { hI: 6, cI: -4, mI: 0, hD: -14, cD: 8, mD: 0, cab: 3, cabY: 0, ojos: 1, cel: 0, bolsa: 1 },
    digitar: { hI: 18, cI: -98, mI: 18, hD: -18, cD: 98, mD: -18, cab: -2, cabY: 8, ojos: 1, cel: 1, bolsa: 0 },
    saludar: { hI: 4, cI: -2, mI: 0, hD: -150, cD: 30, mD: 0, cab: -4, cabY: 0, ojos: 1, cel: 0, bolsa: 0 },
  };
  for (const [nombre, pose] of Object.entries(POSES)) {
    const div = document.createElement('div');
    document.body.appendChild(div);
    const op = crearOperario(div, 'op' + nombre);
    Object.assign(op.st, pose);
    op.aplicar();
  }
</script>
</body>
</html>
