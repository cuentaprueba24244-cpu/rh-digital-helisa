<!doctype html>
<html lang="es">
  <head>

    <title>Los dos alcances de RH digital</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Figtree"; src: url("assets/fonts/figtree-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      :root {
        --ground: #f3f6f4;
        --ink: #1c2420;
        --font-display: "Figtree", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
        font-family: var(--font-display);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div
      id="root"

      data-height="1080"
    >
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1-intro.html"
