      <div id="i-e1" class="etiqueta" style="left: 250px; top: 924px">App del operario</div>
      <div id="i-e2" class="etiqueta" style="left: 1240px; top: 924px">Panel de la oficina</div>
    </div>
  </div>
  <script>
    (function () {
      // ---- rig de personajes (lo inserta tools/armar.mjs; no editar en compositions/) ----
      // Cada personaje es un SVG con ids «prefijo-parte». Las articulaciones giran sobre su punto fijo;
      // el estado vive en un objeto que GSAP anima y `aplicar` lo escribe en el SVG.
      const RIGS = {
        operario: {
          juntas: { hI: [206, 310], cI: [206, 440], mI: [206, 560], hD: [394, 310], cD: [394, 440], mD: [394, 560], pI: [262, 590], pD: [338, 590], cab: [300, 262] },
          ojos: 194, props: ["cel", "bolsa", "tabla", "lapiz"], todo: [300, 892],
        },
        lucrecia: {
          juntas: { hI: [212, 352], cI: [204, 470], mI: [204, 580], hD: [388, 352], cD: [396, 470], mD: [396, 580], cab: [300, 300] },
          ojos: 216, props: ["pila1", "pila2", "pila3", "calc"], todo: [300, 640],
        },
        cliente: {
          juntas: { hI: [206, 310], cI: [206, 440], mI: [206, 560], hD: [394, 310], cD: [394, 440], mD: [394, 560], pI: [262, 590], pD: [338, 590], cab: [300, 262] },
          ojos: 194, props: ["billetes", "lapicero"], todo: [300, 892],
        },
      };
      function rig(px, tipo, inicial = {}) {
        const cfg = RIGS[tipo];
        const el = (id) => document.getElementById(px + "-" + id);
        const st = { ojos: 1, x: 0, y: 0, rot: 0 };
        for (const k of Object.keys(cfg.juntas)) st[k] = 0;
        for (const k of cfg.props) st[k] = 0;
        Object.assign(st, inicial);
        const nodos = {};
        for (const k of [...Object.keys(cfg.juntas), ...cfg.props, "ojos", "todo"]) nodos[k] = el(k);
        function aplicar() {
          for (const [k, [x, y]] of Object.entries(cfg.juntas)) {
            if (nodos[k]) nodos[k].setAttribute("transform", `rotate(${st[k]} ${x} ${y})`);
          }
          for (const k of cfg.props) if (nodos[k]) nodos[k].setAttribute("opacity", st[k]);
          if (nodos.ojos) nodos.ojos.setAttribute("transform", `translate(0 ${cfg.ojos * (1 - st.ojos)}) scale(1 ${st.ojos})`);
          if (nodos.todo) nodos.todo.setAttribute("transform", `translate(${st.x} ${st.y}) rotate(${st.rot} ${cfg.todo[0]} ${cfg.todo[1]})`);
        }
        aplicar();
        return { st, aplicar };
      }
      // Animaciones de personaje sobre una línea de tiempo `tl`
      const pose = (tl, r, p, t, d = 0.5, ease = "power2.inOut") => tl.to(r.st, { ...p, duration: d, ease, onUpdate: r.aplicar }, t);
      const parpadea = (tl, r, t) => {
        tl.to(r.st, { ojos: 0.08, duration: 0.07, ease: "power1.in", onUpdate: r.aplicar }, t);
        tl.to(r.st, { ojos: 1, duration: 0.1, ease: "power1.out", onUpdate: r.aplicar }, t + 0.07);
      };
      // Repite un gesto corto n veces (digitar, escribir, teclear): alterna dos valores de una junta
      const gesto = (tl, r, junta, a, b, t, n, paso = 0.16) => {
        for (let i = 0; i < n; i++) tl.to(r.st, { [junta]: i % 2 ? a : b, duration: paso, ease: "sine.inOut", onUpdate: r.aplicar }, t + i * paso);
      };
      // Camina: piernas alternas y un leve rebote del cuerpo mientras se desplaza en x
      const camina = (tl, r, t, dur, dx, pasos) => {
        tl.to(r.st, { x: r.st.x + dx, duration: dur, ease: "none", onUpdate: r.aplicar }, t);
        const p = dur / pasos;
        for (let i = 0; i < pasos; i++) {
          const s = i % 2 ? 1 : -1;
          tl.to(r.st, { pI: 14 * s, pD: -14 * s, hI: -10 * s, hD: -10 * s, y: -10, duration: p / 2, ease: "sine.out", onUpdate: r.aplicar }, t + i * p);
          tl.to(r.st, { y: 0, duration: p / 2, ease: "sine.in", onUpdate: r.aplicar }, t + i * p + p / 2);
        }
        tl.to(r.st, { pI: 0, pD: 0, hI: 0, hD: 0, duration: 0.2, ease: "sine.out", onUpdate: r.aplicar }, t + dur);
      };
      // ---- fin del rig ----
      function palabras(sel) {
        document.querySelectorAll(sel).forEach((el) => {
          const out = [];
          el.childNodes.forEach((n) => {
            if (n.nodeType === 3) n.textContent.split(/(\s+)/).forEach((t) => { if (t) out.push(/^\s+$/.test(t) ? t : `<span class="w">${t}</span>`); });
            else { n.classList.add("w"); out.push(n.outerHTML); }
          });
          el.innerHTML = out.join("");
        });
      }
      palabras("#i-t1, #i-t2, #i-t3, #i-t4, #i-t5, #i-t7, #i-t8");
      const tl = gsap.timeline({ paused: true });
      const entra = (sel, t) => tl.fromTo(`${sel} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, t);
      const sale = (sel, t) => tl.to(`${sel} .w`, { opacity: 0, filter: "blur(8px)", duration: 0.2, stagger: 0.02, ease: "power3.in" }, t);
      const aparece = (sel, t, d = 0.25) => tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: d }, t);

      const op = rig("iop", "operario", { bolsa: 1 });
      const cl = rig("icl", "cliente", {});
      const lu = rig("ilu", "lucrecia", {});
      const op2 = rig("iop2", "operario", { cel: 1, hI: 18, cI: -98, mI: 18, hD: -18, cD: 98, mD: -18, cab: -2 });
      const lu2 = rig("ilu2", "lucrecia", { hI: 6, cI: -40, hD: -6, cD: 40, cab: 3 });

      gsap.set(["#i-ofi", "#i-cambio", "#i-papel", "#i-fila", "#i-cl", "#i-op"], { opacity: 0 });
      gsap.set(["#i-c1", "#i-c2", "#i-c3", "#i-c4", "#i-c5", "#i-mon", "#i-pie1", "#i-base1"], { opacity: 0 });
      gsap.set(["#i-logo", "#i-mesa2", "#i-pie2", "#i-base2", "#i-mon2", "#i-lu2", "#i-op2", "#i-e1", "#i-e2"], { opacity: 0 });
      gsap.set(".hoja", { opacity: 0 });
      gsap.set(["#i-rop", "#i-rcl", "#i-rlu"], { opacity: 0 });
      [["#i-rop", 2.6, 4.5], ["#i-rcl", 9.6, 11.4], ["#i-rlu", 12.4, 15.4]].forEach(([r, a, b]) => { tl.fromTo(r, { opacity: 0 }, { opacity: 1, duration: 0.25 }, a); tl.to(r, { opacity: 0, duration: 0.2 }, b); });

      // ---------- 1 · la calle ----------
      // la camioneta ya viene entrando en el frame 0 y frena junto al andén
      tl.fromTo("#i-tr", { x: -380 }, { x: 0, duration: 2.0, ease: "power2.out" }, 0);
      {
        // las ruedas giran sobre su propio eje mientras la camioneta avanza
        const r1 = document.getElementById("itr-r1"), r2 = document.getElementById("itr-r2");
        const g = { a: -540 };
        const gira = () => { r1.setAttribute("transform", `rotate(${g.a} 140 272)`); r2.setAttribute("transform", `rotate(${g.a} 520 272)`); };
        gira();
        tl.fromTo(g, { a: -540 }, { a: 0, duration: 2.0, ease: "power2.out", onUpdate: gira }, 0);
      }
      tl.fromTo("#i-tr", { y: 0 }, { y: 4, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.0);
      aparece("#i-lugar", 0.2);
      entra("#i-t1", 0.4);

      // el operario baja con la bolsa y camina hasta la báscula
      tl.fromTo("#i-op", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.2);
      tl.fromTo("#i-op", { x: 0 }, { x: 520, duration: 2.1, ease: "none" }, 2.3);
      camina(tl, op, 2.3, 2.1, 0, 6);
      parpadea(tl, op, 4.6);
      sale("#i-t1", 4.5);
      tl.to("#i-lugar", { opacity: 0, duration: 0.2 }, 4.5);

      // deja la bolsa en la báscula y el visor marca 74,95 kg
      entra("#i-t2", 4.9);
      pose(tl, op, { hI: 22, cI: 8, cab: 6 }, 4.7, 0.5);
      tl.to(op.st, { bolsa: 0, duration: 0.12, onUpdate: op.aplicar }, 5.2);
