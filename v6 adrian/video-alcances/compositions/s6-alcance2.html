    <div id="s6-asiento" class="s6-card">
      <h3>Factura RHD 1</h3>
      <div class="s6-asi"><span>Débito</span><b>1305 Cartera</b><span>2.244.935</span></div>
      <div class="s6-asi"><span>Crédito</span><b>Ingreso</b><span>1.886.500</span></div>

      <h3 class="seg">Recibo · cruza la RHD 1</h3>
      <div class="s6-asi"><span>Débito</span><b>Caja</b><span>500.000</span></div>
      <div class="s6-asi"><span>Crédito</span><b>1305 Cartera</b><span>500.000</span></div>
    </div>
  </div>
  <script>
    (function () {
      // ---- rig de personajes (lo inserta tools/armar.mjs; no editar en compositions/) ----
      // Cada personaje es un SVG con ids «prefijo-parte». Las articulaciones giran sobre su punto fijo;
      // el estado vive en un objeto que GSAP anima y `aplicar` lo escribe en el SVG.
      const RIGS = {
        operario: {
          juntas: { hI: [206, 310], cI: [206, 440], mI: [206, 560], hD: [394, 310], cD: [394, 440], mD: [394, 560], pI: [262, 590], pD: [338, 590], cab: [300, 262] },
          ojos: 194, props: ["cel", "bolsa", "tabla", "lapiz"], todo: [300, 892],
        },
        lucrecia: {
          juntas: { hI: [212, 352], cI: [204, 470], mI: [204, 580], hD: [388, 352], cD: [396, 470], mD: [396, 580], cab: [300, 300] },
          ojos: 216, props: ["pila1", "pila2", "pila3", "calc"], todo: [300, 640],
        },
        cliente: {
          juntas: { hI: [206, 310], cI: [206, 440], mI: [206, 560], hD: [394, 310], cD: [394, 440], mD: [394, 560], pI: [262, 590], pD: [338, 590], cab: [300, 262] },
          ojos: 194, props: ["billetes", "lapicero"], todo: [300, 892],
        },
      };
      function rig(px, tipo, inicial = {}) {
        const cfg = RIGS[tipo];
        const el = (id) => document.getElementById(px + "-" + id);
        const st = { ojos: 1, x: 0, y: 0, rot: 0 };
        for (const k of Object.keys(cfg.juntas)) st[k] = 0;
        for (const k of cfg.props) st[k] = 0;
        Object.assign(st, inicial);
        const nodos = {};
        for (const k of [...Object.keys(cfg.juntas), ...cfg.props, "ojos", "todo"]) nodos[k] = el(k);
        function aplicar() {
          for (const [k, [x, y]] of Object.entries(cfg.juntas)) {
            if (nodos[k]) nodos[k].setAttribute("transform", `rotate(${st[k]} ${x} ${y})`);
          }
          for (const k of cfg.props) if (nodos[k]) nodos[k].setAttribute("opacity", st[k]);
          if (nodos.ojos) nodos.ojos.setAttribute("transform", `translate(0 ${cfg.ojos * (1 - st.ojos)}) scale(1 ${st.ojos})`);
          if (nodos.todo) nodos.todo.setAttribute("transform", `translate(${st.x} ${st.y}) rotate(${st.rot} ${cfg.todo[0]} ${cfg.todo[1]})`);
        }
        aplicar();
        return { st, aplicar };
      }
      // Animaciones de personaje sobre una línea de tiempo `tl`
      const pose = (tl, r, p, t, d = 0.5, ease = "power2.inOut") => tl.to(r.st, { ...p, duration: d, ease, onUpdate: r.aplicar }, t);
      const parpadea = (tl, r, t) => {
        tl.to(r.st, { ojos: 0.08, duration: 0.07, ease: "power1.in", onUpdate: r.aplicar }, t);
        tl.to(r.st, { ojos: 1, duration: 0.1, ease: "power1.out", onUpdate: r.aplicar }, t + 0.07);
      };
      // Repite un gesto corto n veces (digitar, escribir, teclear): alterna dos valores de una junta
      const gesto = (tl, r, junta, a, b, t, n, paso = 0.16) => {
        for (let i = 0; i < n; i++) tl.to(r.st, { [junta]: i % 2 ? a : b, duration: paso, ease: "sine.inOut", onUpdate: r.aplicar }, t + i * paso);
      };
      // Camina: piernas alternas y un leve rebote del cuerpo mientras se desplaza en x
      const camina = (tl, r, t, dur, dx, pasos) => {
        tl.to(r.st, { x: r.st.x + dx, duration: dur, ease: "none", onUpdate: r.aplicar }, t);
        const p = dur / pasos;
        for (let i = 0; i < pasos; i++) {
          const s = i % 2 ? 1 : -1;
          tl.to(r.st, { pI: 14 * s, pD: -14 * s, hI: -10 * s, hD: -10 * s, y: -10, duration: p / 2, ease: "sine.out", onUpdate: r.aplicar }, t + i * p);
          tl.to(r.st, { y: 0, duration: p / 2, ease: "sine.in", onUpdate: r.aplicar }, t + i * p + p / 2);
        }
        tl.to(r.st, { pI: 0, pD: 0, hI: 0, hD: 0, duration: 0.2, ease: "sine.out", onUpdate: r.aplicar }, t + dur);
      };
      // ---- fin del rig ----
      function palabras(sel) {
        document.querySelectorAll(sel).forEach((el) => {
          const out = [];
          el.childNodes.forEach((n) => {
            if (n.nodeType === 3) n.textContent.split(/(\s+)/).forEach((t) => { if (t) out.push(/^\s+$/.test(t) ? t : `<span class="w">${t}</span>`); });
            else { n.classList.add("w"); out.push(n.outerHTML); }
          });
          el.innerHTML = out.join("");
        });
      }
      palabras("#s6-t1, #s6-s1, #s6-t2, #s6-t3, #s6-s3, #s6-t4, #s6-s4, #s6-t5, #s6-s5");
      const tl = gsap.timeline({ paused: true });
      const entra = (sel, t) => tl.fromTo(`${sel} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, t);
      const sale = (sel, t) => tl.to(`${sel} .w`, { opacity: 0, filter: "blur(8px)", duration: 0.2, stagger: 0.02, ease: "power3.in" }, t);
      const aparece = (sel, t) => tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, t);
      const se_va = (sel, t) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in" }, t);
      const tarjeta = (sel, t, dx = 200) => tl.fromTo(sel, { opacity: 0, x: dx, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, t);

      const lu = rig("s6l", "lucrecia", { hI: 6, cI: -40, hD: -6, cD: 40, cab: 4 });
      const cl = rig("s6c", "cliente", {});
      const op = rig("s6o", "operario", { cel: 1, hI: 18, cI: -98, mI: 18, hD: -18, cD: 98, mD: -18, cab: -2 });
      const rhd = Array.from({ length: 12 }, (_, i) => "#s6-r" + (i + 1));

      gsap.set(["#s6-hoyA", "#s6-ahoA", "#s6-mesaA", "#s6-monA", "#s6-lu", "#s6-cursor",
        "#s6-lab2", "#s6-cop", "#s6-sello", "#s6-cufe", "#s6-nota", "#s6-fe",
        "#s6-cl", "#s6-mostrador", "#s6-portatil", "#s6-sobre", "#s6-entregada",
        "#s6-op", "#s6-recibo", "#s6-sinesperar", "#s6-asiento", "#s6-rcl", ...rhd], { opacity: 0 });

      // Capítulo
      tl.fromTo("#s6-cap1", { x: 360, opacity: 0, filter: "blur(14px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.05);
      tl.fromTo("#s6-cap2", { x: 240, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.2);
      tl.to(["#s6-cap1", "#s6-cap2"], { x: -320, opacity: 0, filter: "blur(14px)", duration: 0.35, ease: "power3.in", stagger: 0.05 }, 2.0);

      // A · prefactura y lote de un clic (2,4–8,4 s)
      entra("#s6-t1", 2.6);
      tl.fromTo(["#s6-mesaA", "#s6-monA", "#s6-lu"], { opacity: 0, x: 160 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out", stagger: 0.08 }, 2.7);
      entra("#s6-s1", 3.25);
      aparece("#s6-hoyA", 4.0);
      aparece("#s6-ahoA", 4.6);
      gesto(tl, lu, "mI", -8, 4, 3.4, 10, 0.14);
      parpadea(tl, lu, 4.3);
      tl.fromTo("#s6-cursor", { opacity: 0, x: 0, y: 0 }, { opacity: 1, x: -60, y: -86, duration: 0.6, ease: "power2.inOut" }, 4.9);
      tl.to("#s6-cursor", { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, 5.55);
      tl.to("#s6-boton", { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1 }, 5.55);
      tl.to(lu.st, { mD: -12, duration: 0.08, yoyo: true, repeat: 1, onUpdate: lu.aplicar }, 5.5);
      // salen las 12 facturas de septiembre de una vez
      rhd.forEach((r, i) => {
        const col = i % 4, fila = Math.floor(i / 4);
        tl.fromTo(r, { opacity: 0, x: 0, y: 0, scale: 0.5 }, { opacity: 1, x: -560 + col * 140 - fila * 30, y: -360 + fila * 70, scale: 1, duration: 0.6, ease: "expo.out" }, 5.75 + i * 0.05);
      });
      tl.to("#s6-cursor", { opacity: 0, duration: 0.2 }, 6.0);
