          juntas: { hI: [206, 310], cI: [206, 440], mI: [206, 560], hD: [394, 310], cD: [394, 440], mD: [394, 560], pI: [262, 590], pD: [338, 590], cab: [300, 262] },
          ojos: 194, props: ["billetes", "lapicero"], todo: [300, 892],
        },
      };
      function rig(px, tipo, inicial = {}) {
        const cfg = RIGS[tipo];
        const el = (id) => document.getElementById(px + "-" + id);
        const st = { ojos: 1, x: 0, y: 0, rot: 0 };
        for (const k of Object.keys(cfg.juntas)) st[k] = 0;
        for (const k of cfg.props) st[k] = 0;
        Object.assign(st, inicial);
        const nodos = {};
        for (const k of [...Object.keys(cfg.juntas), ...cfg.props, "ojos", "todo"]) nodos[k] = el(k);
        function aplicar() {
          for (const [k, [x, y]] of Object.entries(cfg.juntas)) {
            if (nodos[k]) nodos[k].setAttribute("transform", `rotate(${st[k]} ${x} ${y})`);
          }
          for (const k of cfg.props) if (nodos[k]) nodos[k].setAttribute("opacity", st[k]);
          if (nodos.ojos) nodos.ojos.setAttribute("transform", `translate(0 ${cfg.ojos * (1 - st.ojos)}) scale(1 ${st.ojos})`);
          if (nodos.todo) nodos.todo.setAttribute("transform", `translate(${st.x} ${st.y}) rotate(${st.rot} ${cfg.todo[0]} ${cfg.todo[1]})`);
        }
        aplicar();
        return { st, aplicar };
      }
      // Animaciones de personaje sobre una línea de tiempo `tl`
      const pose = (tl, r, p, t, d = 0.5, ease = "power2.inOut") => tl.to(r.st, { ...p, duration: d, ease, onUpdate: r.aplicar }, t);
      const parpadea = (tl, r, t) => {
        tl.to(r.st, { ojos: 0.08, duration: 0.07, ease: "power1.in", onUpdate: r.aplicar }, t);
        tl.to(r.st, { ojos: 1, duration: 0.1, ease: "power1.out", onUpdate: r.aplicar }, t + 0.07);
      };
      // Repite un gesto corto n veces (digitar, escribir, teclear): alterna dos valores de una junta
      const gesto = (tl, r, junta, a, b, t, n, paso = 0.16) => {
        for (let i = 0; i < n; i++) tl.to(r.st, { [junta]: i % 2 ? a : b, duration: paso, ease: "sine.inOut", onUpdate: r.aplicar }, t + i * paso);
      };
      // Camina: piernas alternas y un leve rebote del cuerpo mientras se desplaza en x
      const camina = (tl, r, t, dur, dx, pasos) => {
        tl.to(r.st, { x: r.st.x + dx, duration: dur, ease: "none", onUpdate: r.aplicar }, t);
        const p = dur / pasos;
        for (let i = 0; i < pasos; i++) {
          const s = i % 2 ? 1 : -1;
          tl.to(r.st, { pI: 14 * s, pD: -14 * s, hI: -10 * s, hD: -10 * s, y: -10, duration: p / 2, ease: "sine.out", onUpdate: r.aplicar }, t + i * p);
          tl.to(r.st, { y: 0, duration: p / 2, ease: "sine.in", onUpdate: r.aplicar }, t + i * p + p / 2);
        }
        tl.to(r.st, { pI: 0, pD: 0, hI: 0, hD: 0, duration: 0.2, ease: "sine.out", onUpdate: r.aplicar }, t + dur);
      };
      // ---- fin del rig ----
      function palabras(sel) {
        document.querySelectorAll(sel).forEach((el) => {
          const out = [];
          el.childNodes.forEach((n) => {
            if (n.nodeType === 3) n.textContent.split(/(\s+)/).forEach((t) => { if (t) out.push(/^\s+$/.test(t) ? t : `<span class="w">${t}</span>`); });
            else { n.classList.add("w"); out.push(n.outerHTML); }
          });
          el.innerHTML = out.join("");
        });
      }
      palabras("#s4-t1, #s4-t2, #s4-s2, #s4-t3, #s4-s3, #s4-t4, #s4-t5, #s4-s5");
      const tl = gsap.timeline({ paused: true });
      const entra = (sel, t) => tl.fromTo(`${sel} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, t);
      const sale = (sel, t) => tl.to(`${sel} .w`, { opacity: 0, filter: "blur(8px)", duration: 0.2, stagger: 0.02, ease: "power3.in" }, t);
      const aparece = (sel, t) => tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, t);
      const se_va = (sel, t) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in" }, t);
      const tarjeta = (sel, t, dx = 200) => tl.fromTo(sel, { opacity: 0, x: dx, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, t);
      const miles = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");

      const luA = rig("s4a", "lucrecia", { hI: 6, cI: -40, hD: -6, cD: 40, cab: -3 });
      const luB = rig("s4b", "lucrecia", { hI: 6, cI: -40, hD: -6, cD: 40, cab: 4 });
      const cl = rig("s4c", "cliente", { billetes: 1, hD: -30, cD: 50 });
      const op = rig("s4o", "operario", {});

      gsap.set(["#s4-pedido", "#s4-marca", "#s4-hoyA", "#s4-ahoA", "#s4-luA", "#s4-toast",
        "#s4-mesaB", "#s4-monB", "#s4-luB", "#s4-fv1", "#s4-fv2", "#s4-fv3", "#s4-tecla", "#s4-amano",
        "#s4-cH", "#s4-cR", "#s4-ida", "#s4-chip", "#s4-ok", "#s4-api", "#s4-auto", "#s4-chip2",
        "#s4-cl", "#s4-op", "#s4-lab4", "#s4-menos", "#s4-saldo", "#s4-hoyD", "#s4-ahoD"], { opacity: 0 });
      gsap.set("#s4-guia", { scaleY: 0 });
      gsap.set(["#s4-rcl", "#s4-rop"], { opacity: 0 });
      tl.fromTo(["#s4-rcl", "#s4-rop"], { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.15 }, 20.4);
      tl.to(["#s4-rcl", "#s4-rop"], { opacity: 0, duration: 0.2 }, 23.6);
      gsap.set("#s4-flecha", { clipPath: "inset(0% 100% 0% 0%)" });

      // Capítulo
      tl.fromTo("#s4-cap1", { x: 360, opacity: 0, filter: "blur(14px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.05);
      tl.fromTo("#s4-cap2", { x: 240, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.2);
      tl.to(["#s4-cap1", "#s4-cap2"], { x: -320, opacity: 0, filter: "blur(14px)", duration: 0.35, ease: "power3.in", stagger: 0.05 }, 2.0);

      // A · el pedido (2,4–7,6 s)
      entra("#s4-t1", 2.6);
      tarjeta("#s4-pedido", 2.5, 240);
      tarjeta("#s4-luA", 2.7, 160);
      tl.fromTo("#s4-marca", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 3.4);
      aparece("#s4-hoyA", 3.9);
      aparece("#s4-ahoA", 4.5);
      gesto(tl, luA, "mI", -8, 4, 3.6, 12, 0.14);
      gesto(tl, luA, "mD", 6, -6, 3.67, 12, 0.14);
      tl.fromTo("#s4-toast", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 5.4);
      parpadea(tl, luA, 5.9);
      sale("#s4-t1", 6.95);
      se_va(["#s4-hoyA", "#s4-ahoA", "#s4-luA", "#s4-toast"], 6.95);
      // el pedido viaja al nodo Helisa (x 1020, y 895)
      tl.to("#s4-pedido", { x: 300, y: 527, scale: 0.05, duration: 0.55, ease: "power3.in" }, 7.05);
      tl.to("#s4-pedido", { opacity: 0, duration: 0.1 }, 7.52);

      // B · F3, una por una (7,6–14 s)
      entra("#s4-t2", 7.75);
      tl.fromTo(["#s4-mesaB", "#s4-monB", "#s4-luB"], { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", stagger: 0.08 }, 7.8);
      entra("#s4-s2", 8.4);
      aparece("#s4-tecla", 8.9);
      [["#s4-fv1", 9.4], ["#s4-fv2", 10.8], ["#s4-fv3", 12.2]].forEach(([fv, t]) => {
        tl.to("#s4-tecla", { y: 8, duration: 0.08, ease: "power2.in" }, t - 0.12);
        tl.to("#s4-tecla", { y: 0, duration: 0.14, ease: "power2.out" }, t - 0.04);
        tl.to(luB.st, { mD: -12, duration: 0.08, onUpdate: luB.aplicar }, t - 0.12);
        tl.to(luB.st, { mD: 0, duration: 0.14, onUpdate: luB.aplicar }, t - 0.04);
        tl.fromTo(fv, { opacity: 0, x: -260, scale: 0.6 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "expo.out" }, t);
        gesto(tl, luB, "mI", -8, 4, t + 0.2, 6, 0.13);
      });
      tl.fromTo("#s4-amano", { opacity: 0, scale: 1.5, rotation: -6 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.4, ease: "back.out(1.8)" }, 10.0);
      parpadea(tl, luB, 11.4);
      sale("#s4-t2", 13.6);
      sale("#s4-s2", 13.6);
      se_va(["#s4-mesaB", "#s4-monB", "#s4-luB", "#s4-fv1", "#s4-fv2", "#s4-fv3", "#s4-tecla", "#s4-amano"], 13.65);

      // C · la FVE vuelve al sistema (14–20 s)
      entra("#s4-t3", 14.15);
      tarjeta("#s4-cH", 14.35, -160);
      tarjeta("#s4-cR", 14.55, 160);
      entra("#s4-s3", 14.8);
      tl.to("#s4-flecha", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.inOut" }, 15.2);
      tl.fromTo("#s4-ida", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, 15.5);
      tl.fromTo("#s4-chip", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 15.75);
      tl.fromTo("#s4-chip", { x: 0, y: 0 }, { keyframes: [{ x: 480, y: -120, duration: 0.5, ease: "power1.out" }, { x: 960, y: 0, duration: 0.5, ease: "power1.in" }], immediateRender: false }, 15.8);
      aparece("#s4-ok", 16.5);
      // con la API de Helisa la misma vuelta se hace sola
      tl.to("#s4-chip", { opacity: 0, duration: 0.2 }, 17.0);
      tl.fromTo("#s4-auto", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, 17.1);
      aparece("#s4-api", 17.15);
      tl.fromTo("#s4-chip2", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 17.35);
      tl.fromTo("#s4-chip2", { x: 0, y: 0 }, { keyframes: [{ x: 480, y: -120, duration: 0.4, ease: "power1.out" }, { x: 940, y: 0, duration: 0.4, ease: "power1.in" }], immediateRender: false }, 17.4);
      sale("#s4-t3", 19.6);
      sale("#s4-s3", 19.6);
      se_va(["#s4-cH", "#s4-cR", "#s4-flecha", "#s4-ida", "#s4-ok", "#s4-api", "#s4-auto", "#s4-chip2"], 19.65);

      // D · el cliente paga y el operario emite el recibo (20–27,2 s)
      tl.fromTo(["#s4-cl", "#s4-op"], { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", stagger: 0.12 }, 20.0);
      entra("#s4-t4", 20.2);
      pose(tl, cl, { hD: -62, cD: -24, cab: -4 }, 20.6, 0.5);
      pose(tl, op, { hI: 58, cI: 24, cab: 6 }, 20.75, 0.45);
      tl.to(cl.st, { billetes: 0, duration: 0.12, onUpdate: cl.aplicar }, 21.3);
      pose(tl, cl, { hD: 0, cD: 0 }, 21.5, 0.4);
      pose(tl, op, { cel: 1, hI: 18, cI: -98, mI: 18, hD: -18, cD: 98, mD: -18, cab: -2 }, 21.55, 0.5);
      gesto(tl, op, "mD", -26, -12, 22.1, 12, 0.15);
      parpadea(tl, cl, 22.6);
      parpadea(tl, op, 24.4);
      aparece("#s4-lab4", 21.0);
      aparece("#s4-menos", 21.2);
      aparece("#s4-saldo", 21.75);
      {
        const o = { v: 2244935 };
        tl.fromTo(o, { v: 2244935 }, { v: 1744935, duration: 0.8, ease: "power2.out",
          onUpdate: () => { document.querySelector("#s4-saldo").textContent = "Saldo $" + miles(o.v); } }, 22.0);
      }
      aparece("#s4-hoyD", 23.2);
      aparece("#s4-ahoD", 23.8);
      sale("#s4-t4", 26.85);
      se_va(["#s4-cl", "#s4-op", "#s4-lab4", "#s4-menos", "#s4-saldo", "#s4-hoyD", "#s4-ahoD"], 26.9);

      // E · la frontera (27,2–31,2 s)
      entra("#s4-t5", 27.4);
      tl.to("#s4-guia", { scaleY: 1, duration: 0.5, ease: "power2.inOut" }, 27.45);
      entra("#s4-s5", 28.3);
      sale("#s4-t5", 30.85);
      sale("#s4-s5", 30.85);
      tl.to("#s4-guia", { opacity: 0, duration: 0.25 }, 30.9);

      window.__timelines["s4"] = tl;
    })();
  </script>
</template>
