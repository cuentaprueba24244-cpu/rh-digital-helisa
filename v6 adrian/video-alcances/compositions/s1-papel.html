<template>
  <style>
    @font-face { font-family: "Figtree"; src: url("assets/fonts/figtree-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
    #root { position: absolute; inset: 0; background: #f3f6f4; font-family: "Figtree", sans-serif; color: #1c2420; overflow: hidden; }
    .w { display: inline-block; }
    .s1-papel { position: absolute; background: #fff; box-shadow: 0 2px 4px rgba(18,61,43,.10), 0 22px 60px rgba(18,61,43,.16); }
    .s1-papel img { display: block; width: 100%; height: 100%; }
    #s1-rh { left: 90px; top: 110px; width: 1000px; height: 763px; }
    #s1-rc { left: 720px; top: 600px; width: 600px; height: 371px; }
    #s1-circulo { position: absolute; left: 0; top: 0; width: 1000px; height: 763px; overflow: visible; }
    .s1-titulo { position: absolute; left: 1190px; top: 330px; width: 640px; font-size: 88px; font-weight: 800; line-height: 1.04; letter-spacing: -0.02em; }
    .s1-titulo em { font-style: normal; color: #8a5d00; }
  </style>
  <div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
    <div id="s1-rh" class="s1-papel">
      <img src="assets/img/papel-rh.png" alt="Planilla RH de Cofema escrita a mano, septiembre de 2026" />
      <svg id="s1-circulo" viewBox="0 0 1000 763">
        <path id="s1-trazo" pathLength="1" d="M 196 668 C 150 660, 92 672, 90 690 C 88 712, 160 720, 205 712 C 250 704, 252 676, 214 666 C 196 662, 176 664, 160 668"
          fill="none" stroke="#d9a21b" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 1.2" stroke-dashoffset="1.1" />
      </svg>
    </div>
    <div id="s1-rc" class="s1-papel">
      <img src="assets/img/papel-recibo.png" alt="Recibo de caja provisional en papel" />
    </div>
    <h1 id="s1-t1" class="s1-titulo" data-palabras>Cada visita, en papel</h1>
    <h1 id="s1-t2" class="s1-titulo" data-palabras>Cada mes, a sumar <em>a mano</em></h1>
  </div>
  <script>
    (function () {
      function palabras(sel) {
        document.querySelectorAll(sel).forEach((el) => {
          const out = [];
          el.childNodes.forEach((n) => {
            if (n.nodeType === 3) n.textContent.split(/(\s+)/).forEach((t) => { if (t) out.push(/^\s+$/.test(t) ? t : `<span class="w">${t}</span>`); });
            else { n.classList.add("w"); out.push(n.outerHTML); }
          });
          el.innerHTML = out.join("");
        });
      }
      palabras("#s1-t1, #s1-t2");
      const tl = gsap.timeline({ paused: true });
      const entra = (sel, t) => tl.fromTo(`${sel} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, t);
      const sale = (sel, t) => tl.to(`${sel} .w`, { opacity: 0, filter: "blur(8px)", duration: 0.2, stagger: 0.02, ease: "power3.in" }, t);

      // Los papeles ya están en el frame 0 y se asientan
      tl.fromTo("#s1-rh", { x: 70, y: 10, rotation: -6 }, { x: 0, y: 0, rotation: -3, duration: 1.4, ease: "expo.out" }, 0);
      tl.fromTo("#s1-rc", { x: 120, y: 120, rotation: 11, opacity: 0 }, { x: 0, y: 0, rotation: 5, opacity: 1, duration: 1.1, ease: "expo.out" }, 0.35);

      entra("#s1-t1", 0.3);
      tl.to("#s1-trazo", { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power2.inOut" }, 2.6);
      sale("#s1-t1", 3.1);
      entra("#s1-t2", 3.4);
      sale("#s1-t2", 5.85);

      // El papel se junta en el centro, donde aparece la marca de RH digital
      tl.to("#s1-rh", { x: 370, y: -71, scale: 0.12, rotation: 0, duration: 0.95, ease: "power3.inOut" }, 6.15);
      tl.to("#s1-rc", { x: -60, y: -366, scale: 0.12, rotation: 0, duration: 0.95, ease: "power3.inOut" }, 6.05);
      tl.to(["#s1-rh", "#s1-rc"], { opacity: 0, filter: "blur(4px)", duration: 0.22, ease: "power2.in" }, 6.95);

      window.__timelines["s1"] = tl;
    })();
  </script>
</template>
