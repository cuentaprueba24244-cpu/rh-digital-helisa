  <script>
    (function () {
      /* @rig */
      function palabras(sel) {
        document.querySelectorAll(sel).forEach((el) => {
          const out = [];
          el.childNodes.forEach((n) => {
            if (n.nodeType === 3) n.textContent.split(/(\s+)/).forEach((t) => { if (t) out.push(/^\s+$/.test(t) ? t : `<span class="w">${t}</span>`); });
            else { n.classList.add("w"); out.push(n.outerHTML); }
          });
          el.innerHTML = out.join("");
        });
      }
      palabras("#i-t1, #i-t2, #i-t3, #i-t4, #i-t5, #i-t7, #i-t8");
      const tl = gsap.timeline({ paused: true });
      const entra = (sel, t) => tl.fromTo(`${sel} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, t);
      const sale = (sel, t) => tl.to(`${sel} .w`, { opacity: 0, filter: "blur(8px)", duration: 0.2, stagger: 0.02, ease: "power3.in" }, t);
      const aparece = (sel, t, d = 0.25) => tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: d }, t);

      const op = rig("iop", "operario", { bolsa: 1 });
      const cl = rig("icl", "cliente", {});
      const lu = rig("ilu", "lucrecia", {});
      const op2 = rig("iop2", "operario", { cel: 1, hI: 18, cI: -98, mI: 18, hD: -18, cD: 98, mD: -18, cab: -2 });
      const lu2 = rig("ilu2", "lucrecia", { hI: 6, cI: -40, hD: -6, cD: 40, cab: 3 });

      gsap.set(["#i-ofi", "#i-cambio", "#i-papel", "#i-fila", "#i-cl", "#i-op"], { opacity: 0 });
      gsap.set(["#i-c1", "#i-c2", "#i-c3", "#i-c4", "#i-c5", "#i-mon", "#i-pie1", "#i-base1"], { opacity: 0 });
      gsap.set(["#i-logo", "#i-mesa2", "#i-pie2", "#i-base2", "#i-mon2", "#i-lu2", "#i-op2", "#i-e1", "#i-e2"], { opacity: 0 });
      gsap.set(".hoja", { opacity: 0 });
      gsap.set(["#i-rop", "#i-rcl", "#i-rlu"], { opacity: 0 });
      [["#i-rop", 2.6, 4.5], ["#i-rcl", 9.6, 11.4], ["#i-rlu", 12.4, 15.4]].forEach(([r, a, b]) => { tl.fromTo(r, { opacity: 0 }, { opacity: 1, duration: 0.25 }, a); tl.to(r, { opacity: 0, duration: 0.2 }, b); });

      // ---------- 1 · la calle ----------
      // la camioneta ya viene entrando en el frame 0 y frena junto al andén
      tl.fromTo("#i-tr", { x: -380 }, { x: 0, duration: 2.0, ease: "power2.out" }, 0);
      {
        // las ruedas giran sobre su propio eje mientras la camioneta avanza
        const r1 = document.getElementById("itr-r1"), r2 = document.getElementById("itr-r2");
        const g = { a: -540 };
        const gira = () => { r1.setAttribute("transform", `rotate(${g.a} 140 272)`); r2.setAttribute("transform", `rotate(${g.a} 520 272)`); };
        gira();
        tl.fromTo(g, { a: -540 }, { a: 0, duration: 2.0, ease: "power2.out", onUpdate: gira }, 0);
      }
      tl.fromTo("#i-tr", { y: 0 }, { y: 4, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.0);
      aparece("#i-lugar", 0.2);
      entra("#i-t1", 0.4);

      // el operario baja con la bolsa y camina hasta la báscula
      tl.fromTo("#i-op", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.2);
      tl.fromTo("#i-op", { x: 0 }, { x: 520, duration: 2.1, ease: "none" }, 2.3);
      camina(tl, op, 2.3, 2.1, 0, 6);
      parpadea(tl, op, 4.6);
      sale("#i-t1", 4.5);
      tl.to("#i-lugar", { opacity: 0, duration: 0.2 }, 4.5);

      // deja la bolsa en la báscula y el visor marca 74,95 kg
      entra("#i-t2", 4.9);
      pose(tl, op, { hI: 22, cI: 8, cab: 6 }, 4.7, 0.5);
      tl.to(op.st, { bolsa: 0, duration: 0.12, onUpdate: op.aplicar }, 5.2);
      tl.fromTo("#ibs-bolsa", { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: 0.35, ease: "bounce.out" }, 5.2);
      {
        const o = { v: 0 };
        tl.fromTo(o, { v: 0 }, { v: 74.95, duration: 0.8, ease: "power2.out",
          onUpdate: () => { document.getElementById("ibs-num").textContent = o.v.toFixed(2).replace(".", ","); } }, 5.5);
      }
      // anota en la planilla de papel
      pose(tl, op, { hI: 18, cI: -98, mI: 18, hD: -30, cD: 92, mD: -40, cab: -6, tabla: 1, lapiz: 1 }, 6.4, 0.55);
      gesto(tl, op, "mD", -48, -32, 7.0, 12, 0.17);
      parpadea(tl, op, 8.9);
      // la planilla real de Cofema, con la fila del día 5
      tl.fromTo("#i-papel", { opacity: 0, y: 30, rotation: 6 }, { opacity: 1, y: 0, rotation: 3, duration: 0.6, ease: "expo.out" }, 7.2);
      tl.fromTo("#i-fila", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 7.9);
      sale("#i-t2", 8.95);
      tl.to("#i-papel", { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.3, ease: "power3.in" }, 9.0);

      // el cliente sale y firma en papel
      entra("#i-t3", 9.4);
      tl.fromTo("#i-cl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 9.3);
      tl.fromTo("#i-cl", { x: 0 }, { x: -150, duration: 1.0, ease: "none" }, 9.5);
      camina(tl, cl, 9.5, 1.0, 0, 3);
      pose(tl, cl, { hI: 52, cI: 26, cab: 6 }, 10.6, 0.45);
      gesto(tl, cl, "mI", 10, -6, 11.05, 4, 0.14);
      pose(tl, op, { cab: 4 }, 10.7, 0.3);
      parpadea(tl, cl, 11.0);
      sale("#i-t3", 11.45);

      // barrido a la oficina
      tl.to("#i-calle", { x: -500, opacity: 0, filter: "blur(12px)", duration: 0.35, ease: "power3.in" }, 11.65);

      // ---------- 2 · la oficina ----------
      tl.fromTo("#i-ofi", { opacity: 0, x: 500, filter: "blur(12px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 11.95);
      entra("#i-t4", 12.3);
      tl.to(lu.st, { calc: 1, duration: 0.2, onUpdate: lu.aplicar }, 12.2);
      tl.to(lu.st, { pila1: 1, duration: 0.15, onUpdate: lu.aplicar }, 12.5);
      tl.to(lu.st, { pila2: 1, duration: 0.15, onUpdate: lu.aplicar }, 12.8);
      tl.to(lu.st, { pila3: 1, duration: 0.15, onUpdate: lu.aplicar }, 13.1);
      pose(tl, lu, { hI: 16, cI: -10, hD: -6, cD: 40, cab: 3 }, 12.4, 0.5);
      gesto(tl, lu, "cI", -16, -8, 13.0, 14, 0.16);
      ["#i-c1", "#i-c2", "#i-c3", "#i-c4"].forEach((c, i) => tl.fromTo(c, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, ease: "expo.out" }, 13.0 + i * 0.5));
      tl.fromTo("#i-c5", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 15.1);
      // el reloj corre: el tiempo se va sumando a mano
      tl.fromTo("#i-min", { rotation: 0 }, { rotation: 2160, svgOrigin: "75 75", duration: 6.6, ease: "power1.inOut" }, 12.2);
      tl.fromTo("#i-hora", { rotation: 0 }, { rotation: 180, svgOrigin: "75 75", duration: 6.6, ease: "power1.inOut" }, 12.2);
      parpadea(tl, lu, 14.2);
      sale("#i-t4", 15.5);

      // y digita cada factura en Helisa
      entra("#i-t5", 15.9);
      tl.to(["#i-c1", "#i-c2", "#i-c3", "#i-c4", "#i-c5"], { opacity: 0, filter: "blur(6px)", duration: 0.25 }, 16.4);
      tl.fromTo(["#i-mon", "#i-pie1", "#i-base1"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 15.75);
      pose(tl, lu, { hI: 6, cI: -40, hD: -6, cD: 40, cab: -4 }, 15.8, 0.5);
      gesto(tl, lu, "mI", -8, 4, 16.4, 14, 0.14);
      gesto(tl, lu, "mD", 6, -6, 16.47, 14, 0.14);
      parpadea(tl, lu, 17.4);
